[package]
name = "nexus-q-password-core"
version = "0.1.0"
description = "NEXUS-Q Password cryptographic and vault-format core"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["alloc", "serde"] }
atomic-write-file = "0.3.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
